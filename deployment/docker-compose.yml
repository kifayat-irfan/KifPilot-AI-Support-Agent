version: '3.8'

services:
  # PostgreSQL database (using SQLite via file volume for simplicity)
  # In production, you might want to use PostgreSQL instead
  backend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.backend
    container_name: kifpilot-backend
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite+aiosqlite:///app/data/kifpilot.db
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_CHAT_MODEL=qwen3.5:4b
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-in-production-min-32-chars-long-enough}
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - ALGORITHM=HS256
      - CORS_ORIGINS=http://localhost,http://localhost:3000,https://localhost
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - RETRIEVAL_MIN_SCORE=0.3
      - RETRIEVAL_MAX_CONTEXT=8000
      - HYBRID_RRF_K=60
      - RERANKER_ENABLED=false
      - QUERY_EXPANSION_ENABLED=true
      - CONTEXT_COMPRESSION_ENABLED=true
    volumes:
      - sqlite_data:/app/data
      - chroma_data:/app/chroma_db
      - uploads:/app/uploads
      - logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  frontend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.frontend
    container_name: kifpilot-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  ollama:
    image: ollama/ollama:latest
    container_name: kifpilot-ollama
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_ORIGINS=*
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: kifpilot-chromadb
    restart: unless-stopped
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
      - ANONYMIZED_TELEMETRY=False
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: kifpilot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deployment/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

volumes:
  sqlite_data:
  chroma_data:
  ollama_data:
  uploads:
  logs:
  nginx_logs:

networks:
  default:
    name: kifpilot-network
    driver: bridge