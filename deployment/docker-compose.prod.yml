version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.backend
    container_name: kifpilot-backend
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite+aiosqlite:///app/data/kifpilot.db
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_CHAT_MODEL=${OLLAMA_CHAT_MODEL:-qwen3.5:4b}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      - SECRET_KEY=${SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - ALGORITHM=HS256
      - CORS_ORIGINS=${CORS_ORIGINS:-https://yourdomain.com}
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - RETRIEVAL_MIN_SCORE=0.3
      - RETRIEVAL_MAX_CONTEXT=8000
      - HYBRID_RRF_K=60
      - RERANKER_ENABLED=true
      - RERANKER_MODEL_NAME=cross-encoder/ms-marco-MiniLM-L-6-v2
      - RERANKER_MAX_CANDIDATES=20
      - RERANKER_MAX_RESULTS=5
      - QUERY_EXPANSION_ENABLED=true
      - QUERY_EXPANSION_MAX_QUERIES=5
      - QUERY_EXPANSION_USE_LLM=false
      - CONTEXT_COMPRESSION_ENABLED=true
      - CONTEXT_COMPRESSION_MAX_TOKENS=8000
    volumes:
      - sqlite_data:/app/data
      - chroma_data:/app/chroma_db
      - uploads:/app/uploads
      - logs:/app/logs
    expose:
      - "8000"
      - "9090"
    depends_on:
      ollama:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  frontend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.frontend
    container_name: kifpilot-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    expose:
      - "80"
      - "443"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  ollama:
    image: ollama/ollama:latest
    container_name: kifpilot-ollama
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_ORIGINS=*
      - OLLAMA_KEEP_ALIVE=24h
    volumes:
      - ollama_data:/root/.ollama
    expose:
      - "11434"
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 16G
        reservations:
          cpus: '4'
          memory: 8G
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 120s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: kifpilot-chromadb
    restart: unless-stopped
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
      - ANONYMIZED_TELEMETRY=False
    volumes:
      - chroma_data:/chroma/chroma
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  nginx:
    image: nginx:alpine
    container_name: kifpilot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deployment/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 64M

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: kifpilot-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  grafana:
    image: grafana/grafana:10.2.0
    container_name: kifpilot-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  sqlite_data:
    driver: local
    driver_opts:
      type: none
      device: /opt/kifpilot/data
      o: bind
  chroma_data:
    driver: local
    driver_opts:
      type: none
      device: /opt/kifpilot/chroma
      o: bind
  ollama_data:
    driver: local
    driver_opts:
      type: none
      device: /opt/kifpilot/ollama
      o: bind
  uploads:
    driver: local
    driver_opts:
      type: none
      device: /opt/kifpilot/uploads
      o: bind
  logs:
    driver: local
    driver_opts:
      type: none
      device: /opt/kifpilot/logs
      o: bind
  nginx_logs:
    driver: local
    driver_opts:
      type: none
      device: /opt/kifpilot/nginx_logs
      o: bind
  prometheus_data:
    driver: local
    driver_opts:
      type: none
      device: /opt/kifpilot/prometheus
      o: bind
  grafana_data:
    driver: local
    driver_opts:
      type: none
      device: /opt/kifpilot/grafana
      o: bind

networks:
  default:
    name: kifpilot-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16