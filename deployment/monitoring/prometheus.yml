global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'kifpilot'
    environment: '${ENVIRONMENT:-production}'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
      scheme: http
      path_prefix: /

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # KifPilot Backend
  - job_name: 'kifpilot-backend'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - kifpilot
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: kifpilot-backend
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_ip]
        action: replace
        target_label: __address__
        regex: '([^:]+)(?::\d+)?'
        replacement: '${1}:8000'
    metrics_path: /metrics
    scheme: http
    scrape_interval: 15s
    scrape_timeout: 10s

  # KifPilot Frontend (nginx)
  - job_name: 'kifpilot-frontend'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - kifpilot
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: kifpilot-frontend
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_ip]
        action: replace
        target_label: __address__
        regex: '([^:]+)(?::\d+)?'
        replacement: '${1}:80'
    metrics_path: /metrics
    scheme: http
    scrape_interval: 30s

  # Ollama
  - job_name: 'ollama'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - kifpilot
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: kifpilot-ollama
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_ip]
        action: replace
        target_label: __address__
        regex: '([^:]+)(?::\d+)?'
        replacement: '${1}:11434'
    metrics_path: /metrics
    scheme: http
    scrape_interval: 30s

  # ChromaDB
  - job_name: 'chromadb'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - kifpilot
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: kifpilot-chromadb
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_ip]
        action: replace
        target_label: __address__
        regex: '([^:]+)(?::\d+)?'
        replacement: '${1}:8000'
    metrics_path: /api/v1/heartbeat
    scheme: http
    scrape_interval: 30s

  # Node Exporter (infrastructure metrics)
  - job_name: 'node-exporter'
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
    metrics_path: /metrics
    scheme: http
    scrape_interval: 15s

  # cAdvisor (container metrics)
  - job_name: 'cadvisor'
    kubernetes_sd_configs:
      - role: node
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
    metrics_path: /metrics
    scrape_interval: 15s

  # Kubernetes API server
  - job_name: 'kubernetes-apiservers'
    kubernetes_sd_configs:
      - role: endpoints
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        action: keep
        regex: default;kubernetes;https
    metrics_path: /metrics
    scrape_interval: 15s

  # Kubernetes nodes
  - job_name: 'kubernetes-nodes'
    kubernetes_sd_configs:
      - role: node
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
    metrics_path: /metrics
    scrape_interval: 15s

  # Kubernetes pods
  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
    metrics_path: /metrics
    scrape_interval: 15s

  # KifPilot Application metrics (if running outside k8s)
  - job_name: 'kifpilot-app'
    static_configs:
      - targets: ['host.docker.internal:8000', 'host.docker.internal:8001']
        labels:
          service: 'kifpilot'
          environment: '${ENVIRONMENT:-production}'
    metrics_path: /metrics
    scheme: http
    scrape_interval: 15s
    scrape_timeout: 10s

